name: ContentPilot Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
      - "docs/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Discover and generate
        run: python3 scripts/generate_content.py

      - name: Render video
        run: python3 scripts/render_video.py

      - name: Update dashboard
        run: python3 scripts/update_dashboard.py

      - name: Check YouTube configuration
        id: youtube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ] && [ -n "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save video as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: contentpilot-latest-video
          path: generated/contentpilot-latest.mp4
          retention-days: 3
          if-no-files-found: error

      - name: Install YouTube client
        if: steps.youtube.outputs.configured == 'true'
        run: python3 -m pip install -r requirements-youtube.txt

      - name: Upload to YouTube
        if: steps.youtube.outputs.configured == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: private
        run: python3 scripts/upload_youtube.py
      - name: Commit lightweight generated data
        run: |
          git config user.name "ContentPilot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/latest.json generated/latest.txt docs
          git diff --cached --quiet || git commit -m "chore: automated content build"
          git push
