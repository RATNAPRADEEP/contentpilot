name: ContentPilot Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Discover and generate
        run: python3 scripts/generate_content.py
      - name: Render video
        run: python3 scripts/render_video.py
      - name: Update dashboard
        run: python3 scripts/update_dashboard.py
      - name: Commit generated artifacts
        run: |
          git config user.name "ContentPilot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated docs
          git diff --cached --quiet || git commit -m "chore: automated content build"
          git push
