name: ContentPilot Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
      - "docs/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng python3-pil wget xz-utils libegl1 libgl1 libxkbcommon0 libxrender1 libxi6 libxfixes3

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: /opt/blender-4.5.14
          key: blender-4.5.14-linux-x64

      - name: Install Blender 4.5.14 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -O /tmp/blender.tar.xz
          sudo tar -xJf /tmp/blender.tar.xz -C /opt
          sudo mv /opt/blender-4.5.14-linux-x64 /opt/blender-4.5.14

      - name: Verify Blender
        run: /opt/blender-4.5.14/blender --background --version

      - name: Discover and generate
        run: python3 scripts/generate_content.py

      - name: Originality and content preflight
        run: python3 scripts/content_preflight.py

      - name: Remove stale video before render
        run: |
          rm -f generated/contentpilot-latest.mp4
          rm -rf build3d

      - name: Render 3D comedy video
        run: /opt/blender-4.5.14/blender --background --factory-startup --python scripts/render_blender.py

      - name: Validate rendered video
        run: |
          test -s generated/contentpilot-latest.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 generated/contentpilot-latest.mp4
          python3 - <<'PY'
          import subprocess, os
          from PIL import Image, ImageChops, ImageStat
          src="generated/contentpilot-latest.mp4"
          out="/tmp/cpframes"
          os.makedirs(out,exist_ok=True)
          subprocess.run(["ffmpeg","-y","-loglevel","error","-i",src,"-vf","fps=1/4,scale=270:-1","/tmp/cpframes/%03d.jpg"],check=True)
          files=sorted(os.path.join(out,x) for x in os.listdir(out) if x.endswith(".jpg"))
          if len(files)<4: raise SystemExit("Too few sampled video frames")
          imgs=[Image.open(x).convert("RGB") for x in files]
          diffs=[ImageStat.Stat(ImageChops.difference(imgs[i-1],imgs[i])).mean for i in range(1,len(imgs))]
          print("sampled_frames=",len(files),"mean_frame_differences=",diffs)
          if max(diffs)<1.5: raise SystemExit("Video appears visually static; refusing artifact")
          PY

      - name: Update dashboard
        run: python3 scripts/update_dashboard.py

      - name: Check YouTube configuration
        id: youtube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ] && [ -n "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save video as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: contentpilot-latest-video
          path: generated/contentpilot-latest.mp4
          retention-days: 3
          if-no-files-found: error

      - name: Install YouTube client
        if: steps.youtube.outputs.configured == 'true'
        run: python3 -m pip install -r requirements-youtube.txt

      - name: Upload to YouTube
        if: steps.youtube.outputs.configured == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: private
        run: python3 scripts/upload_youtube.py

      - name: Commit lightweight generated data
        run: |
          git config user.name "ContentPilot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/latest.json generated/latest.txt generated/originality_history.json docs
          git diff --cached --quiet || git commit -m "chore: automated content build"
          git push